# =====================================================================
#  Extrait de configuration Nagios : notifications par SMS (123-SMS.net)
#  A adapter puis inclure dans votre commands.cfg
#  Le numero de mobile du contact se declare dans son champ "pager".
# =====================================================================

define command {
    command_name    notify-host-by-sms
    command_line    /usr/local/bin/notify_sms_123sms.sh "$CONTACTPAGER$" "Nagios: hote $HOSTNAME$ est $HOSTSTATE$ ($HOSTOUTPUT$)"
}

define command {
    command_name    notify-service-by-sms
    command_line    /usr/local/bin/notify_sms_123sms.sh "$CONTACTPAGER$" "Nagios: $SERVICEDESC$ sur $HOSTNAME$ est $SERVICESTATE$"
}

# Puis, dans la definition de vos contacts :
#   service_notification_commands   notify-service-by-sms
#   host_notification_commands      notify-host-by-sms
#   pager                           0612345678
